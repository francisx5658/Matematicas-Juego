<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 80" width="260" height="80">
  <defs>
    <!-- Carga la fuente Syne de Google Fonts dentro del SVG -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Syne:wght@800&amp;display=swap');
      
      .brand-text {
        font-family: 'Syne', sans-serif;
        font-size: 26px;
        font-weight: 800;
        fill: url(#grad-text);
        letter-spacing: -0.5px;
      }
    </style>

    <!-- Degradado para el ícono NV -->
    <linearGradient id="grad-nv" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <!-- Degradado para el texto ByNoeliz -->
    <linearGradient id="grad-text" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#a78bfa" />
    </linearGradient>
  </defs>

  <!-- GRUPO ÍCONO (Monograma NV) -->
  <g transform="translate(10, 10) scale(0.6)">
    <!-- Anillo exterior -->
    <circle cx="50" cy="50" r="44" stroke="url(#grad-nv)" stroke-width="4" stroke-dasharray="200 40" opacity="0.8" fill="none" />
    <!-- Monograma N + V -->
    <path d="M 30 68 L 30 32 L 50 60 L 50 32" stroke="url(#grad-nv)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M 50 48 L 65 70 L 78 32" stroke="url(#grad-nv)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <!-- Puntos de acento -->
    <circle cx="30" cy="24" r="4" fill="#f472b6" />
    <circle cx="78" cy="24" r="4" fill="#a78bfa" />
  </g>

  <!-- TEXTO BYNOELIZ -->
  <text x="80" y="48" class="brand-text">ByNoeliz</text>
</svg>
